<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>JixozMed — Организации</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <link rel="stylesheet" href="classifier.css" />
    <link rel="stylesheet" href="sidebar.css" />
    <link rel="stylesheet" href="layout-fix.css" />
    <script src="auth.js"></script>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-panel">
        <button class="sidebar-user" id="sidebarUser" title="Личный кабинет"
                onclick="window.location.href='profile.html';">
            <span id="sidebarUserInitials">?</span>
        </button>
        <button class="sidebar-toggle" title="Свернуть">
            <i class="fas fa-chevron-right"></i>
        </button>
        <div class="sidebar-divider"></div>
        <nav class="sidebar-nav">
            <button class="sidebar-btn" title="Главная" onclick="window.location.href='dashboard.html';">
                <i class="fas fa-th-large"></i>
            </button>
            <button class="sidebar-btn" title="Форма создания" onclick="window.location.href='index.html';">
                <i class="fas fa-list"></i>
            </button>
            <button class="sidebar-btn" title="Пользователи" onclick="window.location.href='users.html';">
                <i class="fas fa-users"></i>
            </button>
        </nav>
        <button class="sidebar-admin active" title="Админ-панель"
                onclick="window.location.href='admin.html';">
            <i class="fas fa-user-shield"></i>
        </button>
        <button class="sidebar-logout" title="Выход" onclick="logout();">
            <i class="fas fa-sign-out-alt"></i>
        </button>
    </div>
</aside>

<div class="admin-app">
    <main class="admin-content">

        <header class="admin-header">
            <div>
                <h1>Организации</h1>
                <p>Справочник организаций и районов</p>
            </div>
        </header>

        <div class="classifier-toolbar">
            <div class="classifier-search">
                <i class="fas fa-search"></i>
                <input id="searchInput" type="text" placeholder="Поиск по названию, району..." autocomplete="off" />
            </div>
            <select id="regionFilter" class="classifier-filter"></select>
            <button id="refreshBtn" class="classifier-refresh" title="Обновить">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>

        <div id="statsBox" class="classifier-stats"></div>

        <div id="loadingBox" class="classifier-loading">
            <i class="fas fa-spinner fa-spin"></i> Загрузка справочника...
        </div>

        <div id="groupedBox" class="classifier-groups"></div>

    </main>
</div>

<script src="supabase-client.js"></script>
<script src="organizations.js"></script>
</body>
</html>
